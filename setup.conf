# ============================================
# MitePC Simulator - Configuration File
# ============================================
# Edit these values to configure the virtual
# hardware that MiteOS will run on.
#
# Lines starting with '#' are comments.
# Format: key = value
# ============================================

# ---------- RAM ----------
# Amount of virtual RAM in megabytes.
# Minimum: 64, Maximum: 16384, Default: 1024
ram_mb = 1024

# ---------- CPU ----------
# Number of virtual CPU cores.
# Minimum: 1, Maximum: 16, Default: 1
cpu_cores = 1

# Clock speed in MHz for the simulated CPU.
# This controls how fast the virtual CPU runs.
# Minimum: 100, Maximum: 4000, Default: 800
cpu_mhz = 800

# ---------- Storage ----------
# Virtual storage capacity in megabytes.
# This is the size of the virtual disk.
# Minimum: 256, Maximum: 131072, Default: 4096
storage_mb = 4096

# ---------- OS Image ----------
# Path to the .mite file that the simulated PC
# boots into. This is the MiteOS disk image.
# If the file does not exist, MitePC will create
# and format a new one automatically.
os_image = ./miteos.mite

# ---------- Storage Directory ----------
# Host directory used for persistent storage.
# Files created inside MiteOS will be stored here
# on the host machine.
storage_dir = ./mite
